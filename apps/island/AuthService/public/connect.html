<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一切在岛 · 个人授权</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="virxact-ui.css"><script src="connect.js" defer></script></head><body><div class="vx-app"><header class="vx-topbar"><a class="vx-appname" href="/">一切在岛</a></header><main class="vx-main"><header class="vx-page-header"><div><h1 class="vx-page-title">连接自己的飞书</h1><p class="vx-page-desc">应用密钥由公司保管。只需确认自己的授权，不用填写配置。</p></div></header><div class="vx-notice"><p>消息与日历分别授权。完成后回到 Mac 设置继续；归档授权保留供旧版兼容。应用密钥与续期凭据由公司保管。</p></div><div class="vx-grid"><section class="vx-card"><header class="vx-card-head"><h2 class="vx-card-title">待办与日历</h2></header><div class="vx-card-body vx-stack"><p>读取主日历，创建和更新你选择同步的待办日程。不删除日程、不邀请参与人。</p><p id="calendar-status">检查配置中…</p><button class="vx-btn" data-purpose="calendar" disabled>授权飞书日历</button></div></section><section class="vx-card"><header class="vx-card-head"><h2 class="vx-card-title">消息接收</h2></header><div class="vx-card-body vx-stack"><p>只读会话与消息。不申请发送、修改或删除消息。</p><p id="receive-status">检查配置中…</p><button class="vx-btn" data-purpose="receive" disabled>授权消息接收</button></div></section><section class="vx-card"><header class="vx-card-head"><h2 class="vx-card-title">材料归档</h2></header><div class="vx-card-body vx-stack"><p>创建或追加云文档、上传主动提交的附件、多维表格新增记录。不申请删除权限。</p><p id="archive-status">检查配置中…</p><button class="vx-btn" data-purpose="archive" disabled>授权飞书归档</button></div></section></div><section class="vx-card"><div class="vx-card-body vx-stack"><p id="feedback" role="status" aria-live="polite">授权仅关联当前中台账号，凭据加密保存。</p><a id="authorize" class="vx-btn vx-btn-primary" target="_blank" rel="noopener noreferrer" hidden>打开飞书授权页</a><button class="vx-btn" id="check" hidden>我已授权，检查连接</button><button class="vx-btn" id="cancel" hidden>取消本次连接</button></div></section></main></div></body></html>
